apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: navinote-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: navinote
  labels:
    app: navinote
spec:
  replicas: 1
  selector:
    matchLabels:
      app: navinote
  template:
    metadata:
      labels:
        app: navinote
    spec:
      containers:
        - name: navinote
          image: ghcr.io/navicore/navinote:latest
          ports:
            - containerPort: 8080
          env:
            - name: NAVINOTE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: navinote-secret
                  key: token
            - name: NAVINOTE_DB_PATH
              value: /data/navinote.db
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: navinote-data
---
apiVersion: v1
kind: Service
metadata:
  name: navinote
spec:
  selector:
    app: navinote
  ports:
    - port: 80
      targetPort: 8080
